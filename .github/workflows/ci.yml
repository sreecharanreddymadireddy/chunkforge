name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra api --extra ingestion
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy chunkforge tests
      - name: Test
        run: uv run python -m pytest
