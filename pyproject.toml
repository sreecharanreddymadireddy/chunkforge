[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chunkforge"
version = "0.1.0"
description = "A production-style RAG chunking and retrieval workbench."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Sreecharan Reddy Madireddy" }]
dependencies = [
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
chunking = [
  "tiktoken>=0.11,<1",
]
api = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]
ingestion = [
  "httpx>=0.28,<1",
  "pymupdf>=1.26,<2",
]
ml = [
  "numpy>=2.0,<3",
  "rank-bm25>=0.2.2,<1",
  "sentence-transformers>=5.0,<6",
  "tiktoken>=0.11,<1",
]
storage = [
  "psycopg[binary,pool]>=3.2,<4",
]
resilience = [
  "redis>=6.4,<7",
]
retrieval = [
  "rank-bm25>=0.2.2,<1",
]
generation = [
  "httpx>=0.28,<1",
]
kafka = [
  "confluent-kafka>=2.11,<3",
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["chunkforge"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=chunkforge --cov-report=term-missing"
testpaths = ["tests"]
markers = ["integration: requires explicitly enabled PostgreSQL or Redis test services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "transformers.*", "torch.*", "numpy.*", "rank_bm25.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

